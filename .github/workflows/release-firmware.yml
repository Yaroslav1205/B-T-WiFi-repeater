name: Release firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing firmware tag to publish, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

env:
  FW_ASSET_NAME: repeater-firmware.bin
  MANIFEST_ASSET_NAME: repeater-ota-manifest.txt
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag_name) || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Build firmware
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py build

      - name: Read firmware version
        run: |
          version="$(grep 'PROJECT_FIRMWARE_VERSION' main/project_wifi_config.h | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "Failed to read PROJECT_FIRMWARE_VERSION" >&2
            exit 1
          fi
          echo "FIRMWARE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify tag matches firmware version
        run: |
          expected_tag="v${FIRMWARE_VERSION}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match ${expected_tag}" >&2
            exit 1
          fi

      - name: Prepare OTA assets
        run: |
          mkdir -p dist
          cp build/softap_sta.bin "dist/${FW_ASSET_NAME}"
          cat > "dist/${MANIFEST_ASSET_NAME}" <<EOF
          version=${FIRMWARE_VERSION}
          firmware_url=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${FW_ASSET_NAME}
          EOF

      - name: Upload OTA assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download OTA assets artifact
        uses: actions/download-artifact@v4
        with:
          name: ota-assets
          path: dist

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes
          gh release upload "${RELEASE_TAG}" \
            "dist/${FW_ASSET_NAME}" \
            "dist/${MANIFEST_ASSET_NAME}" \
            --clobber
